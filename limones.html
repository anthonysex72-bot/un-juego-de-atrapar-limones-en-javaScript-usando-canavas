<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CAZANDO LIMONES CON LUFFY</title>
  <link rel="stylesheet" href="limones.css">
</head>

<body onload="iniciar()">

  <div class="fondo-estrellas"></div>

  <div class="contenedor">

    <header class="encabezado">
      <div class="badge">★ ARCADE • LEVEL UP ★</div>
      <h1>CAZANDO LIMONES CON LUFFY</h1>
      <p class="subtitulo">Atrapa los limones y sobrevive el mayor tiempo posible</p>
      <h2>ANTHONY REGALADO</h2>
    </header>

    <section class="hud">
      <div class="hud-item">
        <span class="hud-icon">🏆</span>
        <div>
          <span class="hud-label">PUNTAJE</span>
          <strong id="txtPuntaje">0</strong>
        </div>
      </div>

      <div class="hud-item">
        <span class="hud-icon">❤️</span>
        <div>
          <span class="hud-label">VIDAS</span>
          <strong id="txtVidas">3</strong>
        </div>
      </div>

      <div class="hud-item">
        <span class="hud-icon">⚡</span>
        <div>
          <span class="hud-label">NIVEL</span>
          <strong id="txtNivel">1</strong>
        </div>
      </div>
    </section>

    <main class="zona-juego">
      <div class="marco-canvas">
        <canvas id="areaJuego" width="600" height="700"></canvas>
      </div>

      <div class="controles">
        <div class="tecla">←</div>
        <div class="instrucciones">
          <strong>CONTROLES</strong>
          <span>Usa solamente ← y → para dirigir al personaje</span>
        </div>
        <div class="tecla">→</div>
      </div>

      <button class="btn-reiniciar" onclick="reiniciar()">↻ REINICIAR PARTIDA</button>
    </main>

    <footer>
      <span>CAZA ESTRELLAS</span>
      <span>•</span>
      <span>HTML • CSS • JAVASCRIPT</span>
    </footer>

  </div>

  <script src="limones.js"></script>
  <script src="utils.js"></script>
</body>
</html>
